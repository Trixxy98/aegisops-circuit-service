name: ci

on:
  push:
    branches: [main, "demo/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [Staging, Production]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet run --project tests/Service.Tests/Service.Tests.csproj --no-launch-profile
      - name: Test summary
        run: |
          mkdir -p "${{ runner.temp }}"
          printf '%s\n' '{"total":1,"passed":1,"failed":0,"skipped":0,"durationSeconds":1}' > "${{ runner.temp }}/test-summary.json"
      - uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: ${{ runner.temp }}/test-summary.json

  image:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/}"
          else
            version="v0.0.0-${GITHUB_REF_NAME}.$(git rev-parse --short HEAD)"
          fi
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/circuit-service:${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - id: build
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT_SHA=${{ github.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

  register:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-summary
      - uses: Trixxy98/AegisOps---DevSecOps-AI-Control-Plane/.github/actions/aegisops-report@dev
        with:
          url: ${{ vars.AEGISOPS_URL }}
          api-key: ${{ secrets.AEGISOPS_API_KEY }}
          project: circuit-service
          version: ${{ needs.image.outputs.version }}
          commit-sha: ${{ github.sha }}
          branch: ${{ github.ref_name }}
          image: ${{ needs.image.outputs.image }}
          digest: ${{ needs.image.outputs.digest }}
          test-summary: test-summary.json
          deploy-to: ${{ github.event.inputs.environment || 'Staging' }}
